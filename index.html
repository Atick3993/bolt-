<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BOLT's Life Update</title>
    <style>
        body {
            background-color: #f5f6fa; 
            color: #333333; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 30px; 
        }

        h1 {
            text-align: left; 
            color: #111111; 
            border-bottom: 2px solid #4CAF50;
            padding-bottom: 10px;
            max-width: 800px;
            margin: 0 0 30px 0;
        }

        .life-category {
            max-width: 800px;
            margin: 15px 0;
            background-color: #ffffff; 
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.08); 
            border-left: 5px solid #4CAF50; 
        }

        .category-title {
            color: #4CAF50;
            margin-top: 0;
            margin-bottom: 15px;
            display: flex; 
            justify-content: space-between;
            align-items: center;
        }

        .bgm-btn-black {
            background-color: transparent; 
            border: 1px solid #121212; 
            color: #121212;
            border-radius: 20px; 
            padding: 6px 12px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            transition: 0.3s;
            text-transform: uppercase; 
        }

        .bgm-btn-black:hover {
            background-color: #121212; 
            color: #ffffff;
        }

        .accordion {
            background-color: #f0f0f0; 
            color: #333333;
            cursor: pointer;
            padding: 15px;
            width: 100%;
            border: none;
            text-align: left;
            outline: none;
            font-size: 16px;
            font-weight: bold;
            transition: 0.4s;
            border-radius: 5px;
            display: flex;
            justify-content: space-between;
        }

        .active, .accordion:hover {
            background-color: #e0e0e0;
        }

        .accordion::after {
            content: '\002B';
            color: #4CAF50;
            font-weight: bold;
            float: right;
            margin-left: 5px;
        }

        .active::after {
            content: "\2212";
        }

        .panel {
            padding: 0 15px;
            background-color: #fafafa;
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease-out;
            border-radius: 0 0 5px 5px;
        }

        .panel ul {
            list-style-type: none;
            padding-left: 0;
        }

        .panel li {
            padding: 12px 10px;
            border-bottom: 1px solid #e0e0e0;
            display: flex; 
            justify-content: space-between; 
            align-items: center;
        }

        .panel li:last-child {
            border-bottom: none;
        }

        #welcome-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(245, 246, 250, 0.95);
            backdrop-filter: blur(8px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.5s ease, visibility 0.5s ease;
        }

        .overlay-card {
            background: #ffffff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            text-align: center;
            border-top: 6px solid #4CAF50;
        }

        .enter-btn {
            background-color: #4CAF50;
            color: white;
            border: none;
            padding: 15px 35px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(76, 175, 80, 0.3);
            transition: transform 0.2s, background-color 0.2s;
            margin-top: 20px;
            text-transform: uppercase;
        }

        .enter-btn:hover {
            background-color: #43a047;
            transform: scale(1.05);
        }
    </style>
</head>
<body>

    <div id="welcome-overlay">
        <div class="overlay-card">
            <h2 style="margin-top:0; color:#111111;">Welcome to BOLT's Life Update</h2>
            <p style="color:#666666; margin-bottom:20px;">Turn your volume up before entering.</p>
            <button class="enter-btn" onclick="enterSite()">Enter Site</button>
        </div>
    </div>

    <audio id="soundLove" src="audio/shamol-love-story.mp3"></audio>
